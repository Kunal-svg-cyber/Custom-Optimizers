name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies (CPU torch, JAX, no W&B)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install jax jaxlib "numpy>=1.24" pytest "pyyaml>=6.0" "matplotlib>=3.7" scikit-learn
      - name: Unit, invariant, oracle and differential tests
        run: python -m pytest -v
      - name: Experiment suite smoke test (tiny settings)
        run: python -m experiments.run_experiments --quick --out /tmp/out --figures /tmp/figs
